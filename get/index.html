<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get AppTimeOut</title>
  <meta name="description" content="Download AppTimeOut for iPhone or Android. Locks that hold — even against yourself.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../apptimeout-icon.png">
  <style>
    :root { --brand:#FD4F01; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#fff6f1; color:#222; text-align:center; padding:24px; }
    main { max-width:420px; }
    img { width:88px; height:88px; border-radius:20px; }
    h1 { margin:16px 0 4px; font-size:1.6rem; }
    p { margin:0 0 22px; color:#555; }
    a.btn { display:flex; align-items:center; justify-content:center; gap:10px; padding:14px 18px; margin:10px 0; border-radius:12px; background:#000; color:#fff; text-decoration:none; font-weight:600; }
    a.home { display:inline-block; margin-top:14px; color:var(--brand); text-decoration:none; font-size:.95rem; }
  </style>
</head>
<body>
  <main>
    <img src="../apptimeout-icon.png" alt="AppTimeOut">
    <h1>AppTimeOut</h1>
    <p id="msg">Taking you to the right app store&hellip;</p>
    <a class="btn" id="ios" href="https://apps.apple.com/us/app/apptimeout/id6755306490">Download on the App Store</a>
    <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.hhdev.apptimeout">Get it on Google Play</a>
    <a class="home" href="../">Learn more at AppTimeOut.com</a>
  </main>
  <script src="platform.js"></script>
  <script>
    (function () {
      var src = "";
      try { src = new URLSearchParams(window.location.search).get("src") || ""; } catch (e) {}
      // Keep the fallback buttons attributed too.
      document.getElementById("ios").href = AppTimeOutPlatform.iosUrl(src);
      document.getElementById("android").href = AppTimeOutPlatform.androidUrl(src);
      var dest = AppTimeOutPlatform.destination(navigator.userAgent || "", navigator.maxTouchPoints || 0, src);
      var msg = document.getElementById("msg");
      if (dest) {
        // Phone or tablet: go straight to the matching store. The buttons stay as a fallback.
        msg.textContent = "Taking you to the " + (dest.indexOf("apple") > -1 ? "App Store" : "Google Play") + "…";
        window.location.replace(dest);
      } else {
        // Desktop / unknown: let the person pick.
        msg.textContent = "Get AppTimeOut on your phone:";
      }
    })();
  </script>
</body>
</html>
